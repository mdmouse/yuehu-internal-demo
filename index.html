.col,.wide-layout>*,.tri-layout>*,.dashboard-top>*,.dashboard-bottom>*,.twin-layout>*{min-width:0}
.dashboard-bottom>.mapmini .floorplan{max-height:265px;width:100%}
.dashboard-bottom>.mapmini .mapcanvas{display:flex;justify-content:center}
.dashboard-bottom>.card{align-self:stretch}
.dashboard-top .cardbody{padding-bottom:18px}
.modal.map-expanded{width:min(1160px,96vw)}
.map-expanded .modalbody{padding:10px 28px;display:flex;justify-content:center}
.map-expanded .floorplan{max-height:74vh;max-width:950px;width:100%}
@media(min-width:1400px) and (max-width:1500px){
 .dashboard-top{grid-template-columns:1fr 1.16fr 1.15fr .95fr}
 .dashboard-top>.staffcard{grid-column:auto}
 .staffcard .cardbody,.staffcard .staffbody{display:block}
 .staffcard .staffbody .softbox{margin-top:15px}
 .dashboard-top .donutbox{gap:8px;flex-wrap:wrap}
 .dashboard-top .donutbox>.grow{min-width:85px}
 .dashboard-top .ring{width:106px!important;height:106px!important}
 .dashboard-top .ringinner{width:80px!important;height:80px!important}
 .dashboard-bottom{grid-template-columns:1fr 1fr 1.1fr}
 .dashboard-bottom>.mapmini{grid-column:auto}
}
@media(max-width:740px){
 .col,.card,.detail-side,.filters,.kpis{min-width:0;max-width:100%}
 .paytotal{gap:8px;flex-wrap:wrap}
 .paytotal b{font-size:27px}
 .dashboard-bottom>.mapmini .floorplan{max-height:none}
 .pageactions{max-width:100%}
 .pageactions>.seg{max-width:100%;overflow-x:auto}
 .map-expanded .modalbody{display:block;padding:8px}
}

.avatar.photo{overflow:hidden;background:#edf3fb}.avatar.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 36%}.avatar.xl.photo{border-radius:15px}.avatar.lg.photo{border-radius:14px}

/* JDY iframe / ?embed=1：隐藏内置侧栏，由简道云分组承载导航 */
body.embed{--side:0px;--top:0px}
body.embed .sidebar,body.embed .topbar,body.embed .mobilebar{display:none!important}
body.embed main{margin-left:0;padding:18px 22px 24px;min-height:100vh}
body.embed .walk{left:22px}
body.embed .pagehead h1{font-size:24px}

function bookingValidate(b,ignore=b.id){
 const r=find('rooms',b.room),c=find('contracts',b.contract);
 if(!r||!c)return '请关联合同及有效房间。';
 if(!Number.isFinite(dateNum(b.start))||!Number.isFinite(dateNum(b.end))||dateNum(b.end)<=dateNum(b.start))return '入住与离所日期不正确。';
 if(!Number.isInteger(b.babies)||b.babies<1||b.babies>r.capacity)return '婴儿人数超过房间额定容量，请选择合适房型。';
 if(['维修中','待清洁','待验收'].includes(r.state))return r.id+' 未完成维修、清洁或复核，不能确认占用。';
 const ownClash=S.bookings.find(x=>x.id!==ignore&&x.contract===b.contract&&['入住中','已锁房','软占位','待审批'].includes(x.state)&&overlap(b.start,b.end,x.start,x.end));
 if(ownClash)return '同一合同已有重叠入住安排：'+ownClash.id+'，不能在其他房间重复占用。';
 const endBuffered=new Date(dateNum(b.end)+S.config.cleanHours*3600000).getTime();
 const clash=S.bookings.find(x=>x.id!==ignore&&x.room===b.room&&x.state!=='已取消'&&['入住中','已锁房','软占位','待审批'].includes(x.state)&&dateNum(b.start)<dateNum(x.end)+S.config.cleanHours*3600000&&dateNum(x.start)<endBuffered);
 if(clash)return '房间冲突：'+clash.customer+' / '+clash.id+'，含清洁缓冲。请调整房间或日期。';
 if(!b.ready)return '护理准备尚未落实，不能只凭房间空闲确认入住。';
 if(c.paid<c.amount*S.config.firstPayment/100)return '已认领首款不足 '+S.config.firstPayment+'%，不满足默认启动条件。';
 if(c.frozen||c.state==='已终止')return '合同处于退款冻结或终止状态，不能继续锁房。';
 return '';
}

function appointmentCreate(){

 if(!date||!start||!end||dateNum(date+'T'+end)<=dateNum(date+'T'+start)||dateNum(date+'T'+start)<now())return fail('预约时间需晚于当前时间，结束晚于开始。');

 if(personnelBusy)return fail('所选人员已被派往 '+personnelBusy.customer+' 的专属服务段，该时段不能重复占用。');
 const conflict=S.appointments.find(a=>a.state!=='已取消'&&a.date===date&&(a.staff===staff||a.space===space||a.mother===m.id)&&a.start<end&&start<a.end);

function causeResolved(e){
 if(e.cause==='handover')return !S.handovers.some(v=>v.baby===e.subject&&v.state==='待接收')&&!bb(e.subject)?.pending;
 if(e.cause==='milk')return find('devices',e.subject)?.state==='在线'&&!S.milk.some(x=>x.device===e.subject&&x.state==='已隔离');
 if(e.cause==='room')return find('rooms',e.where)?.state==='可入住';
 if(e.cause==='house')return find('rooms',e.subject)?.state==='可入住';
 if(e.cause==='dispatch')return S.requests.some(r=>r.contract===e.subject&&r.state==='已分配');
 if(e.cause==='meal')return S.meals.some(x=>x.mother===e.subject&&!mealConflict(x).length&&['已备餐','已送达'].includes(x.state));
 return true;
}

function simRun(){
 const n=Number(val('sim-mothers')),b=Number(val('sim-babies')),down=Number(val('sim-rooms')),staff=Number(val('sim-staff'));
 if([n,b,down,staff].some(x=>!Number.isInteger(x)||x<0)||n>30||b>60||down>24||staff>20)return fail('请输入允许范围内的非负整数。');
 if(b<n)return fail('此情景按每位母亲至少一位婴儿测算，宝宝人数不能小于母亲人数。');
 const avail=S.rooms.filter(r=>r.state==='可入住').sort((a,b)=>b.capacity-a.capacity).slice(down);
 const cap=avail.slice(0,n).reduce((a,r)=>a+r.capacity,0),people=S.staff.filter(s=>s.valid&&s.available&&s.skills.includes('母婴照护')&&s.shift!=='休息').length+staff;
 $('#sim-result').innerHTML=`<div class="grid3"><div class="metric"><label>空房数量缺口</label><b>${Math.max(0,n-avail.length)}</b></div><div class="metric"><label>婴儿位缺口</label><b>${Math.max(0,b-cap)}</b></div><div class="metric"><label>专属服务人员缺口</label><b>${Math.max(0,n-people)}</b></div></div><div class="mt16">${note(n<=avail.length&&b<=cap&&n<=people?'数量层面可继续编排。具体日期、资质、双胎照护与首班仍须逐单核验。':'当前假设有资源缺口：需要调整房型、支援人员或入住安排，不应直接确认承接。',n<=avail.length&&b<=cap&&n<=people?'ok':'warn')}</div><p class="tiny muted mt12">本轮未写入房间占用、员工排期或合同权益。</p>`;
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 e.preventDefault();
 const a=el.dataset.act,id=el.dataset.id||'';
 if(a==='go'){$('#sidebar').classList.remove('open');$('#nav-mask')?.remove();}
 try{handleAction(a,id,el);}catch(error){console.error(error);toast('操作未完成，请关闭当前弹窗后重试。',true);}
});
document.addEventListener('change',e=>{const key=e.target.dataset.change;if(key){try{handleChange(key,e.target.value);}catch(err){console.error(err);toast('筛选更新失败。',true);}}});
document.addEventListener('input',e=>{
 if(e.target.id==='command-query')$('#command-results').innerHTML=searchResults(e.target.value);
 if(e.target.dataset.input==='resident-search')$('#resident-results').innerHTML=residentRows(e.target.value);
});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();return searchOpen();}
 if(e.key==='Escape'){close();$('#sidebar').classList.remove('open');$('#nav-mask')?.remove();return;}
 if(e.target.id==='command-query'&&e.key==='Enter'){e.preventDefault();return $('#command-results [data-act]')?.click();}
 if(e.key==='Enter'&&['baby-code','container-code'].includes(e.target.id)){e.preventDefault();return scanVerify();}
 if(e.key==='Enter'&&e.target.matches('[role="button"]')){e.preventDefault();return e.target.click();}
 if(e.key==='Tab'&&$('#dialog .modal')){
  const focus=$$('#dialog button:not([disabled]),#dialog input:not([disabled]),#dialog textarea,#dialog select,#dialog [tabindex="0"]').filter(x=>x.offsetParent!==null);
  if(!focus.length)return;const first=focus[0],last=focus[focus.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});
